# Phase 5（D48）手选名单：free-programming-books 里没有的开源书和官方免费书，以及要补官方新域名、常用简称的书。
# 和书单里的同一本书（标题相同）会合并：链接、简称加进去，许可证以这里为准。
# license 只在有把握时写（SPDX 写法）；没写的，进主书架后再逐本到官方页面核实。aliases 留给以后按书名匹配评论用。

[[book]]
title = "Structure and Interpretation of Computer Programs"
authors = "Harold Abelson, Gerald Jay Sussman, Julie Sussman"
# mitpress.mit.edu/sicp/ 是 2016 年以前 MIT Press 的官方全文地址，HN 上的链接大多指向它（11-05 晚补）
urls = ["https://mitpress.mit.edu/sites/default/files/sicp/index.html", "https://mitp-content-server.mit.edu/books/content/sectbyfn/books_pres_0/6515/sicp.zip/index.html", "http://mitpress.mit.edu/sicp/"]
license = "CC-BY-SA-4.0"
aliases = ["SICP"]


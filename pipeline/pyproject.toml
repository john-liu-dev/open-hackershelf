[project]
name = "hackershelf-pipeline"
version = "0.1.0"
description = "HackerShelf 数据管线：HN 存档 → 论文/图书候选 → catalog"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.4",
    "fastembed>=0.9.1",
    "httpx[socks]>=0.28",
    "pyarrow>=21",
    "pytz>=2026.6",
    "zstandard>=0.23",
]

[project.scripts]
hs = "hs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
